<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HerCycle — Full 7-day workout routine and 5-day period plan.">
    <title>Full Routine — HerCycle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidenav-overlay" class="fixed inset-0 z-40 hidden"></div>

    <div id="sidenav" class="fixed top-0 left-0 h-full w-64 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 h-full flex flex-col">
            <a href="index.html" class="brand-logo mb-8 block">
                <i class="fas fa-heart-pulse mr-2"></i>HerCycle
            </a>
            <nav class="flex flex-col space-y-2">
                <a href="index.html"   class="nav-link"><i class="fas fa-home mr-3 w-4"></i>Home</a>
                <a href="routine.html" class="nav-link active"><i class="fas fa-dumbbell mr-3 w-4"></i>Full Routine</a>
                <a href="stats.html"   class="nav-link"><i class="fas fa-chart-line mr-3 w-4"></i>Stats</a>
            </nav>
            <div class="mt-auto text-xs text-gray-400 text-center pb-2">Made with 💜 for you</div>
        </div>
    </div>

    <header>
        <div class="main-container px-4">
            <div class="flex items-center justify-between h-16">
                <button id="mobile-menu-button" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-purple-50 transition-colors">
                    <i class="fas fa-bars text-xl" style="color:var(--color-accent)"></i>
                </button>
                <a href="index.html" class="brand-logo text-xl">
                    <i class="fas fa-heart-pulse mr-1"></i>HerCycle
                </a>
                <span id="username-display" class="text-sm font-semibold hidden sm:block" style="color:var(--color-muted)"></span>
            </div>
        </div>
    </header>

    <main class="main-container px-4 py-8 pb-24 space-y-10">

        <!-- 7-DAY SECTION -->
        <div class="text-center fade-in-up">
            <h1 class="section-heading">The 7-Day Routine</h1>
            <p class="section-sub">Your complete weekly plan — strength, flexibility & period relief blended together.</p>
        </div>
        <div id="routine-accordion-container" class="space-y-4"></div>

        <!-- DIVIDER -->
        <div class="flex items-center gap-4 my-4">
            <div class="flex-1 h-px" style="background:var(--color-border)"></div>
            <span class="text-2xl">🌸</span>
            <div class="flex-1 h-px" style="background:var(--color-border)"></div>
        </div>

        <!-- PERIOD PLAN SECTION -->
        <div class="text-center">
            <h2 class="section-heading">The 5-Day Period Plan</h2>
            <p class="section-sub">Gentle, healing movements for when you're on your period.</p>
        </div>
        <div id="period-plan-accordion-container" class="space-y-4"></div>

    </main>

    <script src="script.js"></script>
</body>
</html>
