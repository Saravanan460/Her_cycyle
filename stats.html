<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="HerCycle — Your cycle history and hydration stats.">
    <title>Stats — HerCycle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidenav-overlay" class="fixed inset-0 z-40 hidden"></div>

    <div id="sidenav" class="fixed top-0 left-0 h-full w-64 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 h-full flex flex-col">
            <a href="index.html" class="brand-logo mb-8">
                <i class="fas fa-seedling mr-2"></i>HerCycle
            </a>
                <a href="index.html"   class="nav-link"><i class="fas fa-home mr-3 w-4"></i>Home</a>
                <a href="routine.html" class="nav-link"><i class="fas fa-spa mr-3 w-4"></i>Full Routine</a>
                <a href="stats.html"   class="nav-link active"><i class="fas fa-chart-pie mr-3 w-4"></i>Stats</a>
                <a href="#" id="logout-btn" class="nav-link text-red-500"><i class="fas fa-sign-out-alt mr-3 w-4"></i>Logout</a>
            </nav>
            <div class="mt-auto text-xs text-gray-400 text-center pb-2">Nurture yourself 🌿</div>
        </div>
    </div>

    <header>
        <div class="main-container px-4">
            <div class="flex items-center justify-between h-16 md:h-20">
                <button id="mobile-menu-button" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors">
                    <i class="fas fa-bars text-xl" style="color:var(--color-text)"></i>
                </button>
                <a href="index.html" class="brand-logo text-xl md:text-2xl">
                    <i class="fas fa-seedling mr-2"></i>HerCycle
                </a>
                <div class="flex items-center gap-2">
                    <span id="username-display" class="text-sm font-semibold hidden sm:block" style="color:var(--color-muted)"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container px-4 py-8 pb-24 space-y-6 md:space-y-8">

        <div class="text-center fade-in-up">
            <h1 class="section-heading">Your Stats</h1>
            <p class="section-sub">A history of your cycle and hydration habits.</p>
        </div>

        <!-- CYCLE HISTORY -->
        <div class="card">
            <div class="flex items-center gap-3 mb-4">
                <span class="text-3xl">🌸</span>
                <h2 class="card-title m-0">Cycle History</h2>
            </div>
            <div style="max-height:22rem;overflow-y:auto;padding-right:0.25rem">
                <div id="cycle-stats-container" class="space-y-3"></div>
            </div>
        </div>

        <!-- HYDRATION CHART -->
        <div class="card">
            <div class="flex items-center gap-3 mb-4">
                <span class="text-3xl">💧</span>
                <h2 class="card-title m-0">Monthly Hydration</h2>
            </div>
            <div class="flex justify-between items-center mb-6">
                <button id="prev-month-btn-progress" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors" style="color:var(--color-text)">
                    <i class="fas fa-chevron-left text-sm"></i>
                </button>
                <h3 id="progress-chart-title" class="font-semibold text-lg" style="color:var(--color-text); font-family: 'Lora', serif;"></h3>
                <button id="next-month-btn-progress" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors" style="color:var(--color-text)">
                    <i class="fas fa-chevron-right text-sm"></i>
                </button>
            </div>
            <div id="stats-container" class="grid grid-cols-2 gap-4 mb-6"></div>
            <div class="relative w-full overflow-hidden" style="min-height: 250px;">
                <canvas id="waterIntakeChart"></canvas>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
